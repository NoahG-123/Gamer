<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox - Gmail</title>
<link rel="icon" href="/sites/mail.google.com/favicon.svg">
<style>
:root{--bg:#f6f8fc;--panel:#fff;--text:#1f1f1f;--muted:#444746;--line:#e3e3e3;--hover:#eaf1fb;--sel:#c2e7ff;--unreadbg:#fff;--readbg:#f2f6fc;--blue:#0b57d0}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Google Sans",Roboto,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
#top{height:64px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px}
.ham{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}.ham:hover{background:#e8eaed}
.logo{display:flex;align-items:center;gap:6px;width:200px;padding-left:4px}.logo svg{width:40px;height:32px}.logo span{font-size:22px;color:#5f6368}
.search{flex:0 1 720px;height:48px;background:#e9eef6;border-radius:24px;display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;margin-left:36px}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;color:var(--text)}.search:focus-within{background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15)}
.tr{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:6px}.iconb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#444746}.iconb:hover{background:#e8eaed}
.avatar{width:32px;height:32px;border-radius:50%;background:#7b5cd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;margin-left:8px}
#main{display:flex;height:calc(100% - 64px)}
#nav{width:256px;padding:8px 0 0 8px;flex:none}
.compose{height:56px;width:138px;border-radius:16px;background:#c2e7ff;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;font-size:14px;font-weight:500;margin:0 0 16px 8px}.compose:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
.nitem{display:flex;align-items:center;height:32px;padding:0 12px 0 26px;border-radius:0 16px 16px 0;margin-right:12px;gap:18px;color:#202124;position:relative}.nitem:hover{background:#e8eaed}.nitem.on{background:#d3e3fd;font-weight:700}
.nitem .cnt{margin-left:auto;font-size:12px;font-weight:700}.nitem svg{width:20px;height:20px;fill:#444746;flex:none}
.labels{margin-top:14px}.labels h4{font-size:14px;font-weight:500;color:#444746;padding:8px 0 4px 26px;margin:0;display:flex;align-items:center}.labels h4 span{margin-left:auto;margin-right:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.ldot{width:12px;height:12px;border-radius:2px;background:#8e8e8e;margin:0 4px}
#list{flex:1;background:var(--panel);border-radius:16px;margin:0 16px 16px 0;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{height:48px;display:flex;align-items:center;padding:0 8px 0 16px;gap:4px;border-bottom:1px solid var(--line);color:#444746;font-size:12px}
.toolbar .sp{flex:1}
.tabs{display:flex;height:56px;border-bottom:1px solid var(--line)}.tab{width:252px;display:flex;align-items:center;gap:14px;padding-left:24px;color:#444746;border-bottom:3px solid transparent}.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.rows{flex:1;overflow:auto}
.row{display:flex;align-items:center;height:40px;padding:0 16px 0 8px;border-bottom:1px solid #f1f3f4;cursor:pointer;font-size:14px;position:relative;background:var(--readbg);color:#5f6368}
.row.unread{background:var(--unreadbg);color:#202124;font-weight:700}
.row:hover{box-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);z-index:1}
.row .cb,.row .st,.row .imp{width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-right:8px;color:#c4c7c5;flex:none}
.row .st.on{color:#f4b400}.row .imp.on{color:#f4b400}.row .cb{border:2px solid #c4c7c5;border-radius:2px;width:16px;height:16px;margin:0 14px 0 6px}
.row .from{width:200px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .subj{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:inherit}.row .subj .sn{color:#5f6368;font-weight:400}.row.unread .subj .sn{color:#5f6368}
.row .lbl{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#e8eaed;color:#3c4043;margin-right:8px;font-weight:500}
.row .att{width:20px;margin-right:8px;color:#5f6368;flex:none}
.row .date{width:76px;text-align:right;flex:none;font-size:12px}
.empty{padding:60px;text-align:center;color:#5f6368}
#thread{display:none;flex-direction:column;flex:1;overflow:hidden}
#thread.on{display:flex}#list.hide .rows,#list.hide .tabs{display:none}
.th{padding:14px 72px 6px 72px;font-size:22px;font-weight:400;display:flex;align-items:center;gap:8px}
.th .lbl{font-size:12px;padding:2px 8px;border-radius:4px;background:#ddd;color:#333;font-weight:500}
.msgs{flex:1;overflow:auto;padding:0 0 40px 0}
.msg{border-bottom:1px solid var(--line);padding:12px 24px 16px 72px;position:relative}
.msg .av{position:absolute;left:20px;top:14px;width:40px;height:40px;border-radius:50%;background:#7b5cd6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}.msg .hd b{font-size:14px}.msg .hd .em{color:#5f6368;font-size:12px}.msg .hd .dt{margin-left:auto;color:#5f6368;font-size:12px;white-space:nowrap}
.msg .to{color:#5f6368;font-size:12px;margin-bottom:14px}
.msg .bd{font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;max-width:760px}.msg .bd a{color:#15c;text-decoration:underline}
.msg.col .bd,.msg.col .to,.msg.col .atts{display:none}.msg.col{padding-bottom:10px;cursor:pointer}.msg.col .snip{color:#5f6368;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:760px}
.atts{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.att2{width:180px;height:120px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;cursor:pointer;background:#f5f5f5}
.att2 .n{background:#fff;padding:8px 10px;font-size:12px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att2 .s{color:#5f6368;font-size:11px}
.att2:hover{box-shadow:0 1px 2px rgba(60,64,67,.3)}
.replybar{padding:16px 72px;display:flex;gap:8px}.replybar button{border:1px solid #dadce0;border-radius:18px;height:36px;padding:0 16px 0 12px;display:flex;align-items:center;gap:8px;font-weight:500;color:#444746}.replybar button:hover{background:#f6f8fc}
#compose{position:fixed;right:64px;bottom:0;width:560px;height:560px;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12),0 5px 5px -3px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:10}
#compose.on{display:flex}#compose .ch{background:#404040;color:#fff;height:40px;display:flex;align-items:center;padding:0 12px;font-size:14px;border-radius:8px 8px 0 0;font-weight:500}#compose .ch span{flex:1}
#compose input,#compose textarea{border:0;outline:none;font:inherit;padding:10px 16px;border-bottom:1px solid var(--line)}#compose textarea{flex:1;resize:none;border:0;padding:12px 16px;font-size:14px}
#compose .cf{display:flex;align-items:center;padding:12px 16px;gap:12px}#compose .send{background:var(--blue);color:#fff;border-radius:18px;height:36px;padding:0 24px;font-weight:500}
.spinner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#5f6368}
.toast{position:fixed;left:24px;bottom:24px;background:#202124;color:#fff;padding:14px 24px;border-radius:4px;font-size:14px;box-shadow:0 3px 5px rgba(0,0,0,.2);z-index:20;display:none}
.rc{padding:8px 24px 8px 8px;display:flex;align-items:center;gap:6px;color:#444746}.rc .b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}.rc .b:hover{background:#e8eaed}
.pg{margin-left:auto;font-size:12px;color:#444746;display:flex;align-items:center;gap:12px;padding-right:12px}
#nav.hide{display:none}
.tab{cursor:pointer}
.tab:hover{background:rgba(60,64,67,.06)}
.iconb{cursor:pointer}
.tb-act{cursor:pointer;color:#444746;user-select:none;padding:4px 6px;border-radius:4px}
.tb-act:hover{background:rgba(60,64,67,.08)}
.tb-act.off{opacity:.35;cursor:default}
.tb-act.off:hover{background:none}
.row .cb{cursor:pointer;border:2px solid #c4c7c5;border-radius:2px;width:16px;height:16px;display:inline-block;flex:none}
.row .cb.on{background:#0b57d0;border-color:#0b57d0;position:relative}
.row .cb.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.sel{background:#c2e7ff}
.st,.imp{cursor:pointer}
#menu{position:fixed;z-index:60;background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(60,64,67,.3),0 8px 24px rgba(60,64,67,.15);padding:8px 0;min-width:220px;display:none;font-size:14px}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;padding:8px 20px;cursor:pointer;color:#202124}
#menu button:hover{background:#f1f3f4}
#menu button:disabled{color:#9aa0a6;cursor:default;background:none}
#menu .sep{height:1px;background:#e8eaed;margin:6px 0}
.compose .cf span[role=button]{cursor:pointer;padding:2px 4px;border-radius:3px}
.compose .cf span[role=button]:hover{background:rgba(60,64,67,.1)}
</style>
</head>

const SYS=[["inbox","Inbox"],["starred","Starred"],["snoozed","Snoozed"],["sent","Sent"],["drafts","Drafts"],["trash","Trash"]];
let box=null,threads=[],labels=[],view="inbox",openId=null,back="#inbox",q="";
let cat="primary";const picked=new Set();
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmtDate(iso,long){const d=new Date(iso),n=new Date();if(long)return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+" ("+ago(d)+")";if(d.toDateString()===n.toDateString())return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});if(d.getFullYear()===n.getFullYear())return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});return d.toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"})}
function ago(d){const m=Math.round((Date.now()-d)/60000);if(m<60)return m+" minutes ago";const h=Math.round(m/60);if(h<48)return h+" hours ago";const dd=Math.round(h/24);if(dd<60)return dd+" days ago";return Math.round(dd/30)+" months ago"}
function initials(n){return (n||"?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function color(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return ["#7b5cd6","#1a73e8","#188038","#c5221f","#e37400","#9334e6","#007b83","#a50e0e"][h%8]}
async function load(){const r=await fetch("/api/mail?record=0",{cache:"no-store"});box=await r.json();threads=box.threads;labels=box.labels;$("#acctAv").textContent=box.account.initials;$("#acctAv").title=box.account.name+"\n"+box.account.email;$("#acctAv").style.background=box.account.color;renderNav();route()}
function count(id){return threads.filter(t=>!t.trashed&&t.unread&&t.labels.includes(id)).length}
function renderNav(){$("#navItems").innerHTML=SYS.map(([id,n])=>`<a class="nitem ${view===id?"on":""}" href="#${id}">${SVG[id]||SVG.more}<span>${n}</span>${id==="inbox"&&count("inbox")?`<span class="cnt">${count("inbox")}</span>`:""}${id==="drafts"&&drafts.length?`<span class="cnt" style="font-weight:400">${drafts.length}</span>`:""}</a>`).join("")+`<a class="nitem" href="#spam">${SVG.more}<span>Spam</span></a>`;$("#labelItems").innerHTML=labels.map(l=>`<a class="nitem ${view==="label/"+l.id?"on":""}" href="#label/${l.id}"><span class="ldot" style="background:${l.color||"#8e8e8e"}"></span><span>${esc(l.name)}</span>${count(l.id)?`<span class="cnt">${count(l.id)}</span>`:""}</a>`).join("")}
const CATS={promotions:"promotions",social:"social"};
function catOf(t){return t.labels.includes("promotions")?"promotions":t.labels.includes("social")?"social":"primary"}
function filtered(){let list=threads;if(view==="inbox")list=list.filter(t=>!t.trashed&&(t.labels.includes("inbox")||t.labels.includes("promotions")||t.labels.includes("social"))&&catOf(t)===cat);else if(view==="starred")list=list.filter(t=>!t.trashed&&t.starred);else if(view==="sent")list=list.filter(t=>!t.trashed&&(t.labels.includes("sent")||t.from.startsWith("me")));else if(view==="trash")list=list.filter(t=>t.trashed);else if(view==="spam")list=list.filter(t=>!t.trashed&&t.labels.includes("spam"));else if(view==="drafts")list=drafts.map(d=>({id:d.id,subject:d.subject||"(no subject)",snippet:d.body.slice(0,120),from:"Draft",labels:["drafts"],lastAt:d.at,unread:false,starred:false,draft:true}));
  else if(view==="snoozed")list=[];else if(view.startsWith("label/"))list=list.filter(t=>!t.trashed&&t.labels.includes(view.slice(6)));else if(view.startsWith("search/")){const s=decodeURIComponent(view.slice(7)).toLowerCase();list=list.filter(t=>!t.trashed&&(t.subject+" "+t.snippet+" "+t.from+" "+(t.searchText||"")).toLowerCase().includes(s))}return list}
function tabCounts(){
  const c={primary:0,promotions:0,social:0};
  for(const t of threads){if(t.trashed||!t.unread)continue;if(!t.labels.includes("inbox")&&!t.labels.includes("promotions")&&!t.labels.includes("social"))continue;c[catOf(t)]++}
  return c;
}
function renderTabs(){
  const c=tabCounts();
  $("#tabs").querySelectorAll(".tab").forEach(el=>{
    const k=el.dataset.cat;
    el.classList.toggle("on",k===cat);
    let b=el.querySelector(".tcnt");
    if(!b){b=document.createElement("span");b.className="tcnt";b.style.cssText="margin-left:8px;color:#0b57d0;font-weight:600";el.appendChild(b)}
    b.textContent=c[k]?String(c[k]):"";
  });
}
$("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;cat=t.dataset.cat;picked.clear();renderList()});
function renderList(){const list=filtered();$("#tabs").style.display=view==="inbox"?"flex":"none";if(view==="inbox")renderTabs();updateToolbar();$("#pg").textContent=list.length?`1–${list.length} of ${list.length}`:"";if(!list.length){$("#rows").innerHTML=`<div class="empty">${view==="drafts"?"You don't have any saved drafts.":view==="trash"?"No conversations in Trash.":view==="spam"?"Hooray, no spam here!":view.startsWith("search")?"No messages matched your search.":"Nothing here."}</div>`;return}
$("#rows").innerHTML=list.map(t=>{const lbls=t.labels.filter(l=>!["inbox","sent","spam"].includes(l)).map(l=>{const L=labels.find(x=>x.id===l);return L?`<span class="lbl" style="background:${L.color?L.color+"33":"#e8eaed"}">${esc(L.name)}</span>`:""}).join("");return `<div class="row ${t.unread?"unread":""} ${picked.has(t.id)?"sel":""}" data-id="${t.id}"><span class="cb ${picked.has(t.id)?"on":""}" data-pick="${t.id}"></span><span class="st ${t.starred?"on":""}" data-star="${t.id}">${t.starred?"★":"☆"}</span><span class="imp ${t.important?"on":""}" data-imp="${t.id}" title="${t.important?"Marked important":"Mark as important"}">${t.important?"⯈":"▹"}</span><span class="from">${esc(t.from)}</span><span class="subj">${lbls}${esc(t.subject)} <span class="sn">- ${esc(t.snippet)}</span></span>${t.attachments?`<span class="att">📎</span>`:""}<span class="date">${fmtDate(t.lastAt)}</span></div>`}).join("")}
$("#rows").addEventListener("click",async e=>{
  const pk=e.target.closest("[data-pick]");
  if(pk){e.stopPropagation();const id=pk.dataset.pick;if(picked.has(id))picked.delete(id);else picked.add(id);renderList();return}
  const im=e.target.closest("[data-imp]");
  if(im){e.stopPropagation();const t=threads.find(x=>x.id===im.dataset.imp);if(t){t.important=!t.important;renderList()}return}
  const st=e.target.closest("[data-star]");if(st){e.stopPropagation();const id=st.dataset.star;const t=threads.find(x=>x.id===id);t.starred=!t.starred;await fetch("/api/mail/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,starred:t.starred})});renderList();return}const r=e.target.closest(".row");if(r){
    if(view==="drafts"){const d=drafts.find(x=>x.id===r.dataset.id);if(d){editDraft(d)}return}
    back="#"+view;location.hash="#"+view+"/"+r.dataset.id}});
async function renderThread(id){const r=await fetch("/api/mail/thread?id="+encodeURIComponent(id),{cache:"no-store"});if(!r.ok){location.hash=back;return}const {thread:t}=await r.json();const tt=threads.find(x=>x.id===id);if(tt)tt.unread=false;renderNav();document.title=t.subject+" - "+box.account.email+" - Gmail";
$("#th").innerHTML=esc(t.subject)+" "+t.labels.filter(l=>l!=="sent").map(l=>{const L=labels.find(x=>x.id===l);return `<span class="lbl">${esc(L?L.name:l==="inbox"?"Inbox":l)}</span>`}).join(" ");$("#pg2").textContent="";
const n=t.messages.length;$("#msgs").innerHTML=t.messages.map((m,i)=>{const me=m.from.email===box.account.email;const col=n>3&&i<n-2;return `<div class="msg ${col?"col":""}" data-i="${i}"><div class="av" style="background:${color(m.from.email)}">${initials(m.from.name||m.from.email)}</div><div class="hd"><b>${esc(me?"me":m.from.name||m.from.email)}</b><span class="em">&lt;${esc(m.from.email)}&gt;</span><span class="dt">${fmtDate(m.at,true)}</span></div><div class="snip">${esc(m.body.replace(/\s+/g," ").slice(0,140))}</div><div class="to">to ${esc(m.to.map(a=>a.email===box.account.email?"me":(a.name||a.email)).join(", "))}${m.cc&&m.cc.length?", cc: "+esc(m.cc.map(a=>a.name||a.email).join(", ")):""} ▾</div><div class="bd">${m.html?m.html:linkify(esc(m.body))}</div>${m.attachments&&m.attachments.length?`<div class="atts">${m.attachments.map(a=>`<div class="att2" data-path="${esc(a.path||"")}" title="${esc(a.name)}"><div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:34px">${icon(a.name)}</div><div class="n">${esc(a.name)}<div class="s">${size(a.size)}</div></div></div>`).join("")}</div>`:""}</div>`}).join("")+`<div class="replybar"><button onclick="reply()">↩ Reply</button><button onclick="reply(true)">↪ Forward</button></div>`;
$("#msgs").querySelectorAll(".msg.col").forEach(el=>el.addEventListener("click",()=>el.classList.remove("col")));$("#msgs").querySelectorAll(".att2").forEach(el=>el.addEventListener("click",()=>openAttachment(el.dataset.path,el.title)));$("#msgs").scrollTop=$("#msgs").scrollHeight;window.currentThread=t}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1">$1</a>')}
function icon(n){const e=n.split(".").pop().toLowerCase();return {pdf:"📄",wav:"🎧",mp3:"🎧",flac:"🎧",zip:"🗜",jpg:"🖼",jpeg:"🖼",png:"🖼",docx:"📝",doc:"📝",xlsx:"📊",csv:"📊",txt:"📃",gpg:"🔒","7z":"🗜"}[e]||"📎"}
function size(b){return b<1024?b+" B":b<1048576?Math.round(b/1024)+" KB":(b/1048576).toFixed(1)+" MB"}
function openAttachment(path,name){if(!path){location.href="/api/mail/attachment?thread="+encodeURIComponent(openId)+"&name="+encodeURIComponent(name);return}fetch("/api/fs/open",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path})}).then(r=>r.json()).then(d=>{if(d.openable&&d.url)location.href=d.url;else location.href="/lf/"+encodeURIComponent(path).replace(/%2F/g,"/")}).catch(()=>{location.href="/lf/"+encodeURIComponent(path).replace(/%2F/g,"/")})}
async function trash(){if(!openId)return;const t=threads.find(x=>x.id===openId);if(t)t.trashed=true;await fetch("/api/mail/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:openId,trashed:true})});toast("Conversation moved to Trash.");location.hash=back}
function openCompose(to,sub,body){if(!to&&!sub&&!body)draftId=null;$("#compose").classList.add("on");$("#cto").value=to||"";$("#csub").value=sub||"";$("#cbody").value=body||"";$("#ctitle").textContent=sub?sub:"New Message";(to?$("#cbody"):$("#cto")).focus()}
function closeCompose(){$("#compose").classList.remove("on")}
function reply(fwd){const t=window.currentThread;if(!t)return;const last=[...t.messages].reverse().find(m=>m.from.email!==box.account.email)||t.messages[t.messages.length-1];window.composeThread=fwd?null:t.id;openCompose(fwd?"":(last.from.name?`${last.from.name} <${last.from.email}>`:last.from.email),(fwd?"Fwd: ":"Re: ")+t.subject.replace(/^(Re|Fwd): /i,""),fwd?"\n\n---------- Forwarded message ---------\nFrom: "+(last.from.name||"")+" <"+last.from.email+">\n\n"+last.body:"")}
async function send(){const to=$("#cto").value.trim(),subject=$("#csub").value.trim(),body=$("#cbody").value;if(!to){toast("Please specify at least one recipient.");return}if(!body.trim()){toast("Send this message without text in the body?");return}const r=await fetch("/api/mail/send",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({threadId:window.composeThread||undefined,to,subject,body})});window.composeThread=null;
  if(r.ok){
    if(draftId){const i=drafts.findIndex(d=>d.id===draftId);if(i>=0)drafts.splice(i,1);persistDrafts();draftId=null}
    closeCompose();toast("Message sent.");await refresh();renderNav();
  }else{closeCompose();toast("Message could not be sent.")}}
// ---- toolbar, selection, bulk actions ----
function updateToolbar(){
  const any=picked.size>0;
  ["tbArchive","tbSpam","tbTrash","tbRead"].forEach(id=>{const el=$("#"+id);if(el)el.classList.toggle("off",!any)});
  const all=$("#selAll");
  if(all){const list=filtered();all.classList.toggle("on",list.length>0&&picked.size===list.length)}
}
function toggleSelectAll(){
  const list=filtered();
  if(picked.size===list.length){picked.clear()}else{picked.clear();list.forEach(t=>picked.add(t.id))}
  renderList();
}
function selectMenu(e){
  const list=filtered();
  openMenu(e,[
    {label:"All",act:()=>{picked.clear();list.forEach(t=>picked.add(t.id))}},
    {label:"None",act:()=>picked.clear()},
    {label:"Read",act:()=>{picked.clear();list.filter(t=>!t.unread).forEach(t=>picked.add(t.id))}},
    {label:"Unread",act:()=>{picked.clear();list.filter(t=>t.unread).forEach(t=>picked.add(t.id))}},
    {label:"Starred",act:()=>{picked.clear();list.filter(t=>t.starred).forEach(t=>picked.add(t.id))}},
  ]);
}
function moreMenu(e){
  openMenu(e,[
    {label:"Mark all as read",act:async()=>{for(const t of filtered().filter(x=>x.unread))await setState(t.id,{read:true});toast("Marked as read");await refresh()}},
    {label:"Select all",act:()=>{const l=filtered();picked.clear();l.forEach(t=>picked.add(t.id))}},
    {sep:true},
    {label:"Empty Trash now",disabled:view!=="trash",act:async()=>{const l=filtered();for(const t of l)await setState(t.id,{trashed:true});toast("Trash is already empty on this computer.")}},
  ]);
}
function setState(id,patch){return fetch("/api/mail/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({id:id},patch))})}
async function bulk(what){
  if(!picked.size)return;
  const ids=[...picked];
  for(const id of ids){
    const t=threads.find(x=>x.id===id);
    if(!t)continue;
    if(what==="archive"){await setState(id,{labels:t.labels.filter(l=>l!=="inbox")})}
    else if(what==="spam"){await setState(id,{labels:t.labels.filter(l=>l!=="inbox").concat("spam")})}
    else if(what==="trash"){await setState(id,{trashed:true})}
    else if(what==="read"){await setState(id,{read:!t.unread?false:true})}
  }
  picked.clear();
  toast(ids.length+" conversation"+(ids.length===1?"":"s")+" "+({archive:"archived",spam:"reported as spam",trash:"moved to Trash",read:"marked as read"})[what]+".");
  await refresh();
}

// ---- single-thread actions ----
async function archive(){
  if(!openId)return;
  const t=threads.find(x=>x.id===openId);
  if(t){t.labels=t.labels.filter(l=>l!=="inbox");await setState(openId,{labels:t.labels})}
  toast("Conversation archived.");location.hash=back;
}
async function spam(){
  if(!openId)return;
  const t=threads.find(x=>x.id===openId);
  if(t){const l=t.labels.filter(x=>x!=="inbox").concat("spam");t.labels=l;await setState(openId,{labels:l})}
  toast("Conversation reported as spam.");location.hash=back;
}

// ---- a small menu, used by several of the buttons above ----
function openMenu(e,items){
  const m=$("#menu");
  m.innerHTML=items.map((it,i)=>it.sep?'<div class="sep"></div>':`<button data-i="${i}"${it.disabled?" disabled":""}>${esc(it.label)}</button>`).join("");
  m.classList.add("on");
  const r=(e.currentTarget||e.target).getBoundingClientRect();
  m.style.left=Math.min(r.left,window.innerWidth-m.offsetWidth-8)+"px";
  m.style.top=Math.min(r.bottom+4,window.innerHeight-m.offsetHeight-8)+"px";
  m.querySelectorAll("button").forEach(b=>b.addEventListener("click",async()=>{
    const it=items[Number(b.dataset.i)];
    m.classList.remove("on");
    if(it&&!it.disabled&&it.act){await it.act();renderList()}
  }));
  const close=ev=>{if(!ev.target.closest("#menu")){m.classList.remove("on");document.removeEventListener("click",close,true)}};
  setTimeout(()=>document.addEventListener("click",close,true),0);
}

// ---- top-bar buttons ----
function showApps(e){
  openMenu(e,[
    {label:"Gmail",act:()=>{location.hash="#inbox"}},
    {label:"Calendar",act:()=>{location.href="https://calendar.google.com/"}},
    {label:"Account",act:()=>{location.href="https://myaccount.google.com/"}},
  ]);
}
function showAccount(e){
  openMenu(e,[
    {label:box.account.name,disabled:true},
    {label:box.account.email,disabled:true},
    {sep:true},
    {label:"Manage your Google Account",act:()=>{location.href="https://myaccount.google.com/"}},
  ]);
}
function showSettings(e){
  openMenu(e||{currentTarget:document.querySelector('[title="Settings"]')},[
    {label:"Display density: Default",disabled:true},
    {label:"Inbox type: Default",disabled:true},
    {sep:true},
    {label:"Mark everything as read",act:async()=>{for(const t of threads.filter(x=>x.unread&&!x.trashed))await setState(t.id,{read:true});toast("Everything marked as read.");await refresh()}},
  ]);
}
function showHelp(){toast("Gmail help needs a connection to Google, and this is a copy saved to this computer.")}
function searchOptions(){
  const from=prompt("Search mail from (leave blank for any)");
  if(from===null)return;
  const t=from.trim();
  location.hash=t?"#search/"+encodeURIComponent(t):"#inbox";
}
function newLabel(){
  const name=prompt("New label name");
  if(name===null)return;
  const n=name.trim();
  if(!n)return;
  if(labels.some(l=>l.name.toLowerCase()===n.toLowerCase())){toast("A label with that name already exists.");return}
  labels.push({id:"user-"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-"),name:n,color:"#8e8e8e"});
  renderNav();
  toast('Label "'+n+'" created. Open a conversation to apply it.');
}

// ---- drafts, kept in this browser the way Gmail keeps them on the server ----
const drafts=(()=>{try{return JSON.parse(localStorage.getItem("gmail.drafts")||"[]")}catch(e){return[]}})();
function persistDrafts(){try{localStorage.setItem("gmail.drafts",JSON.stringify(drafts))}catch(e){}}
let draftId=null;
function saveDraft(){
  const to=$("#cto").value.trim(),subject=$("#csub").value.trim(),body=$("#cbody").value;
  if(!to&&!subject&&!body.trim()){toast("Nothing to save.");return}
  const existing=draftId?drafts.find(d=>d.id===draftId):null;
  if(existing){Object.assign(existing,{to:to,subject:subject,body:body,at:new Date().toISOString()})}
  else{const d={id:"draft-"+Date.now().toString(36),to:to,subject:subject,body:body,at:new Date().toISOString()};drafts.unshift(d);draftId=d.id}
  persistDrafts();closeCompose();renderNav();renderList();
  toast("Draft saved.");
}
function editDraft(d){draftId=d.id;openCompose(d.to,d.subject,d.body)}
function discardDraft(){
  if(draftId){const i=drafts.findIndex(d=>d.id===draftId);if(i>=0)drafts.splice(i,1);persistDrafts();draftId=null;toast("Draft discarded.")}
  closeCompose();renderNav();renderList();
}
function attachFile(){toast("Attaching a file needs a connection to Google. This copy can only read what is already here.")}
function insertLink(){
  const url=prompt("Link to");
  if(!url)return;
  const b=$("#cbody");
  b.value=(b.value?b.value+" ":"")+url.trim();
  b.focus();
}
function insertEmoji(){
  const b=$("#cbody");
  const e=["🙂","👍","🙏","😅","❤️","😐","🤞","👀"][Math.floor(Math.random()*8)];
  b.value=b.value+e;b.focus();
}

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",4000)}
async function refresh(){const r=await fetch("/api/mail?record=0",{cache:"no-store"});const b=await r.json();threads=b.threads;renderNav();if(openId)renderThread(openId);else renderList()}
function route(){picked.clear();const h=location.hash.replace(/^#/,"")||"inbox";const parts=h.split("/");let v=parts[0];let id=null;if(v==="label"||v==="search"){v=parts[0]+"/"+parts[1];id=parts[2]||null}else id=parts[1]||null;view=v;openId=id;if(view.startsWith("search/"))$("#q").value=decodeURIComponent(view.slice(7));if(id){$("#thread").classList.add("on");$("#list").classList.add("hide");$("#tb").style.display="none";renderThread(id)}else{$("#thread").classList.remove("on");$("#list").classList.remove("hide");$("#tb").style.display="flex";document.title=(view==="inbox"&&count("inbox")?"Inbox ("+count("inbox")+")":view.charAt(0).toUpperCase()+view.slice(1).split("/")[0])+" - "+box.account.email+" - Gmail";renderList()}renderNav()}
window.addEventListener("hashchange",route);$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value.trim();location.hash=v?"#search/"+encodeURIComponent(v):"#inbox"}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCompose()});
try{const es=new EventSource("/api/events");es.onmessage=m=>{try{const ev=JSON.parse(m.data);if(ev.type==="mail.changed"||ev.type==="flag"||ev.type==="trigger.fired")refresh()}catch(_){}}}catch(_){}
load();
</script>
